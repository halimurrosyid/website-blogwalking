<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="128" height="128" rx="34" fill="url(#bwGrad)" filter="url(#subtleGlow)"/>

  <!-- Gloss Highlight (Top Half) -->
  <path d="M0 34 C0 15.2 15.2 0 34 0 L94 0 C112.8 0 128 15.2 128 34 L128 58 Q64 74 0 58 Z" fill="url(#glossGrad)"/>

  <!-- Border Outline -->
  <rect x="2" y="2" width="124" height="124" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5"/>

  <!-- Monogram Logo BW -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="83" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="-1.5" style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));">BW</text>
  </g>

  <!-- Status / Accent Dot -->
  <circle cx="102" cy="26" r="7" fill="#34d399" stroke="#ffffff" stroke-width="2.5"/>
</svg>
